name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: buildkit-arm64
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            image: ghcr.io/clashwithjpa/server
            build-args: ""
          - app: web
            image: ghcr.io/clashwithjpa/web
            build-args: |
              PUBLIC_SERVER_URL=${{ vars.PUBLIC_SERVER_URL || 'https://api.clashwithjpa.com' }}
              PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
              PUBLIC_SENTRY_SPOTLIGHT=${{ vars.PUBLIC_SENTRY_SPOTLIGHT || '0' }}
              PUBLIC_TURNSTILE_SITE_KEY=${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: tcp://buildkitd:1234

      - name: Authenticate to ghcr.io
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.docker
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 -w0)" > ~/.docker/config.json
          chmod 600 ~/.docker/config.json

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          # Keeps a plain single-arch manifest — no unknown/unknown attestation
          # entry for `compose pull` to trip over.
          provenance: false
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
