services:
  jpa-db:
    extends:
      file: ./apps/server/docker-compose.yaml
      service: jpa-db
    profiles:
      - all
      - services
      - db
      - prod

  jpa-redis:
    extends:
      file: ./apps/server/docker-compose.yaml
      service: jpa-redis
    profiles:
      - all
      - services
      - prod

  jpa-minio:
    extends:
      file: ./apps/server/docker-compose.yaml
      service: jpa-minio
    profiles:
      - all
      - services
      - media
      - prod

  jpa-server:
    container_name: jpa-server
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: clashwithjpa/server:latest
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
      - ./apps/server/.env.server-db
    ports:
      - 7100:3000
    depends_on:
      jpa-db:
        condition: service_healthy
      jpa-redis:
        condition: service_healthy
      jpa-minio:
        condition: service_healthy
    profiles:
      - prod

  jpa-web:
    extends:
      file: ./apps/web/docker-compose.yaml
      service: jpa-web
    depends_on:
      - jpa-server
    profiles:
      - prod

  drizzle-gateway:
    container_name: drizzle-gateway
    image: ghcr.io/drizzle-team/gateway:latest@sha256:547b89d55127deb6c5b21ba9ed2397be07affc300da9d0ec6d7ed1290687b4dc
    restart: unless-stopped
    ports:
      - 7103:4983
    volumes:
      - drizzle-gateway-data:/app
    profiles:
      - all
      - analytics

  redis-insight:
    container_name: redis-insight
    image: redis/redisinsight:latest@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    restart: unless-stopped
    ports:
      - 7104:5540
    volumes:
      - redis-insight-data:/data
    profiles:
      - all
      - analytics
    depends_on:
      jpa-redis:
        condition: service_healthy
        required: false

  spotlight:
    container_name: spotlight
    image: ghcr.io/getsentry/spotlight:latest@sha256:daba2de5136fc8db0a0cde45280aa4d369b5ea0a394fe762c86aa42294a11d4d
    restart: unless-stopped
    ports:
      - 8969:8969
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - all
      - analytics

volumes:
  jpa-pg-data:
  jpa-redis-data:
  jpa-minio-data:
  drizzle-gateway-data:
  redis-insight-data:

networks:
  default:
    name: clashwithjpa-network
    external: true
