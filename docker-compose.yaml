services:
  jpa-db:
    extends:
      file: ./apps/server/docker-compose.yaml
      service: jpa-db
    profiles:
      - all
      - services
      - db
      - prod

  jpa-redis:
    extends:
      file: ./apps/server/docker-compose.yaml
      service: jpa-redis
    profiles:
      - all
      - services
      - prod

  jpa-rustfs:
    extends:
      file: ./apps/server/docker-compose.yaml
      service: jpa-rustfs
    profiles:
      - all
      - services
      - media
      - prod

  jpa-server:
    container_name: jpa-server
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: clashwithjpa/server:latest
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
      - ./apps/server/.env.server-db
    ports:
      - 7100:3000
    depends_on:
      jpa-db:
        condition: service_healthy
      jpa-redis:
        condition: service_healthy
      jpa-rustfs:
        condition: service_healthy
    profiles:
      - prod

  jpa-web:
    extends:
      file: ./apps/web/docker-compose.yaml
      service: jpa-web
    # Link-preview cards come straight from the API container, not back in through Cloudflare.
    environment:
      API_UPSTREAM: http://jpa-server:3000
    depends_on:
      - jpa-server
    profiles:
      - prod

  drizzle-gateway:
    container_name: drizzle-gateway
    image: ghcr.io/drizzle-team/gateway:latest@sha256:3f09490584ad97cb5fa6d2a7335b405b8ac96e3b17a427830930f4ff70fe3993
    restart: unless-stopped
    ports:
      - 7103:4983
    volumes:
      - drizzle-gateway-data:/app
    profiles:
      - all
      - analytics

  redis-insight:
    container_name: redis-insight
    image: redis/redisinsight:latest@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    restart: unless-stopped
    ports:
      - 7104:5540
    volumes:
      - redis-insight-data:/data
    profiles:
      - all
      - analytics
    depends_on:
      jpa-redis:
        condition: service_healthy
        required: false

  spotlight:
    container_name: spotlight
    image: ghcr.io/getsentry/spotlight:latest@sha256:8c0db1d8ce11db8587b70bc1971cd731d0a71b37214de3ad322e28183f2e5a2c
    restart: unless-stopped
    ports:
      - 8969:8969
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - all
      - analytics

volumes:
  jpa-pg-data:
  jpa-redis-data:
  jpa-rustfs-data:
  drizzle-gateway-data:
  redis-insight-data:

networks:
  default:
    name: clashwithjpa-network
    external: true
