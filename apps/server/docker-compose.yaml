services:
  jpa-db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: jpa-db
    shm_size: 2G
    restart: unless-stopped
    env_file: .env.server-db
    ports:
      - 7101:5432
    volumes:
      - jpa-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jpa-redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    container_name: jpa-redis
    restart: unless-stopped
    volumes:
      - jpa-redis-data:/data
    ports:
      - 7102:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jpa-rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    container_name: jpa-rustfs
    restart: unless-stopped
    env_file: .env.server-db
    environment:
      RUSTFS_REGION: ap-mumbai-1
    ports:
      - 7105:9000
      - 7106:9001
    volumes:
      - jpa-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jpa-pg-data:
  jpa-redis-data:
  jpa-rustfs-data:
