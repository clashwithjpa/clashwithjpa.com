services:
  jpa-db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: jpa-db
    shm_size: 2G
    restart: unless-stopped
    env_file: .env.server-db
    ports:
      - 7101:5432
    volumes:
      - jpa-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jpa-redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    container_name: jpa-redis
    restart: unless-stopped
    volumes:
      - jpa-redis-data:/data
    ports:
      - 7102:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jpa-minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: jpa-minio
    restart: unless-stopped
    env_file: .env.server-db
    ports:
      - 7105:9000
      - 7106:9001
    volumes:
      - jpa-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jpa-pg-data:
  jpa-redis-data:
  jpa-minio-data:
