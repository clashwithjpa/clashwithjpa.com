# Keyed on the response type rather than the URL, because prerendered pages are
# served from clean paths (/clans -> clans.html) that a `\.html$` match misses.
map $sent_http_content_type $cache_control {
    default "";
    ~^text/html "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip_static on;
    add_header Cache-Control $cache_control;

    location /_app/immutable/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 200.html is the SPA shell for routes that weren't prerendered.
    location / {
        try_files $uri $uri/ $uri.html /200.html;
    }
}
